<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Java Cheats — a fast, searchable single-page Java reference covering basics, OOP, collections, utilities, modern Java, and advanced topics." />
  <meta name="author" content="Kirby Paladan" />
  <title>Java Cheats — Instant Java Reference</title>

  <!-- Favicon / app icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png" />
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
  <link rel="shortcut icon" href="assets/icons/favicon.ico" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="stylesheet" href="assets/css/darkmode.css" />
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button id="menuToggle" class="icon-btn menu-toggle" aria-label="Toggle sidebar" title="Toggle sidebar (Ctrl+B)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <a href="#" class="brand" data-topic="home">
      <img src="assets/icons/brand-mark.png" alt="Java Cheats logo" class="brand-mark-img" />
      <span class="brand-text">
        <span class="brand-name">JAVA CHEATS</span>
        <span class="brand-author">by Kirby Paladan</span>
      </span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="Search topics, methods, syntax…  (press /)" autocomplete="off" spellcheck="false" />
      <kbd class="search-kbd">/</kbd>
      <button id="searchClear" class="search-clear" aria-label="Clear search" hidden>×</button>
      <div id="searchResults" class="search-results" hidden></div>
    </div>

    <div class="topbar-actions">
      <button id="favToggle" class="icon-btn" aria-label="Show favorites" title="Favorites">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="badge" id="favBadge" hidden>0</span>
      </button>
      <button id="recentToggle" class="icon-btn" aria-label="Recently viewed" title="Recently viewed">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      </button>
      <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">DARK</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <!-- ============ SIDEBAR ============ -->
    <aside id="sidebar" class="sidebar">
      <nav class="sidebar-nav" id="sidebarNav">
        <!-- categories injected by navigation.js -->
      </nav>
      <div class="sidebar-footer">
        <span class="sidebar-hint">↑↓ navigate · ⏎ open · / search</span>
      </div>
    </aside>
    <div id="sidebarOverlay" class="sidebar-overlay" hidden></div>

    <!-- ============ MAIN ============ -->
    <main id="main" class="main">
      <div class="breadcrumb" id="breadcrumb"></div>
      <article id="content" class="content"><!-- topic injected by app.js --></article>

      <nav class="prev-next" id="prevNext"><!-- prev/next injected --></nav>
    </main>
  </div>

  <!-- ============ FAV / RECENT DRAWER ============ -->
  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <h3 id="drawerTitle">Favorites</h3>
      <button id="drawerClose" class="icon-btn" aria-label="Close">×</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
  </aside>
  <div id="drawerOverlay" class="drawer-overlay" hidden></div>

  <!-- ============ TOAST ============ -->
  <div id="toast" class="toast" hidden></div>

  <!-- ============ SCRIPTS ============ -->
  <script src="assets/js/cheats.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
